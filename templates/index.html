<!doctype html>
<html lang="ko" data-mode="system" data-next="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Hacker News front-page stories, summarized in Korean">
  <meta name="theme-color" content="#ffffff">
  <script>
    (function () {
      var mode = 'system';

      try {
        var saved = localStorage.getItem('theme');
        if (saved === 'light' || saved === 'dark') mode = saved;
      } catch (error) {
        mode = 'system';
      }

      var theme = mode;
      var next = mode === 'system' ? 'light' : mode === 'light' ? 'dark' : 'system';

      if (mode === 'system') {
        theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }

      document.documentElement.dataset.mode = mode;
      document.documentElement.dataset.next = next;
      document.documentElement.dataset.theme = theme;

      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.content = theme === 'dark' ? '#141517' : '#ffffff';
    })();
  </script>
  <meta name="referrer" content="no-referrer">
  <title>hnfront</title>
  <meta property="og:type" content="website">
  <meta property="og:title" content="hnfront">
  <meta property="og:description" content="Hacker News front-page stories, summarized in Korean">
  <meta property="og:url" content="https://hnfront.parksb.xyz/">
  <meta property="og:image" content="https://hnfront.parksb.xyz/assets/og.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="assets/favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" sizes="any">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
  <style>
    /* Theme */

    :root {
      color-scheme: light;

      --paper: #ffffff;
      --ink: #222222;
      --summary: #555555;
      --visited: #555555;
      --muted: #6b7280;
      --accent: #ff6600;
      --accent-text: #c2410c;
      --footer-bg: var(--accent);
      --footer-ink: #1e1e1e;
      --thumb-opacity: 1;
      --thumb-filter: none;
    }

    :root[data-theme="dark"] {
      color-scheme: dark;

      --paper: #141517;
      --ink: #e4e6eb;
      --summary: #c3c7cf;
      --visited: #9aa1ad;
      --muted: #8e95a2;
      --accent: #ff8533;
      --accent-text: #ff8533;
      --footer-bg: var(--accent);
      --footer-ink: #17181a;
      --thumb-opacity: 0.9;
      --thumb-filter: brightness(0.85);
    }

    /* Base */

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    a:hover {
      color: var(--accent-text);
    }

    a:focus-visible {
      outline: 2px solid var(--accent-text);
      outline-offset: 5px;
      border-radius: 2px;
    }

    main {
      width: min(100% - 48px, 840px);
      margin: 28px auto 32px;
    }

    .skip {
      position: absolute;
      top: -60px;
      left: 20px;
      padding: 12px;
      background: var(--ink);
      color: var(--paper);
      z-index: 3;
    }

    .skip:focus {
      top: 12px;
    }

    /* Feed */

    .feed {
      padding: 0;
      margin: 0;
      list-style: none;
    }

    .story {
      display: flow-root;
      padding: 24px 0 32px;
    }

    h2 {
      margin: 0;
      font-size: 18px;
      line-height: 1.55;
      font-weight: 600;
      letter-spacing: -.4px;
      word-break: keep-all;
      overflow-wrap: anywhere;
    }

    h2 a:visited {
      color: var(--visited);
    }

    .summary {
      margin: 10px 0 14px;
      font-size: 15px;
      line-height: 1.75;
      color: var(--summary);
      word-break: keep-all;
      overflow-wrap: anywhere;
    }

    .meta {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      font-size: 12px;
      line-height: 1.6;
      color: var(--muted);
    }

    .source {
      overflow-wrap: anywhere;
    }

    time {
      white-space: nowrap;
    }

    .points,
    .comments {
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .points svg,
    .comments svg {
      width: 14px;
      height: 14px;
      flex-shrink: 0;
    }

    .points svg {
      width: 10px;
      height: 10px;
    }

    /* Thumbnails */

    .thumb {
      float: right;
      width: 200px;
      margin: 3px 0 16px 24px;
      aspect-ratio: 2 / 1;
      overflow: hidden;
      border-radius: 2px;
    }

    .thumb img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: var(--thumb-opacity);
      filter: var(--thumb-filter);
    }

    .thumb img:hover {
      opacity: 1;
    }

    .thumb[hidden] {
      display: none;
    }

    .empty {
      padding: 40px 0;
      color: var(--muted);
      font-size: 13px;
    }

    .story .katex {
      font-size: 1.05em;
    }

    .story .katex-display {
      margin: 12px 0;
      overflow-x: auto;
      overflow-y: hidden;
    }

    /* Footer */

    footer {
      padding: 24px 0;
      background: var(--footer-bg);
      color: var(--footer-ink);
      font-size: 11px;
      line-height: 1.6;
      text-align: left;
    }

    .footer-inner {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px 16px;
      width: min(100% - 48px, 840px);
      margin: 0 auto;
      line-height: 0.8;
    }

    footer a:hover {
      color: inherit;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    footer a:focus-visible {
      outline-color: currentColor;
    }

    footer nav {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .theme-toggle {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 0;
      border: 0;
      background: none;
      color: inherit;
      font: inherit;
      line-height: 1;
      cursor: pointer;
    }

    .theme-toggle:hover {
      opacity: 0.72;
    }

    .theme-toggle:focus-visible {
      outline: 2px solid currentColor;
      outline-offset: 4px;
      border-radius: 2px;
    }

    .theme-toggle svg {
      display: none;
      width: 14px;
      height: 14px;
    }

    .theme-label {
      display: none;
    }

    :root[data-next="system"] .theme-toggle .theme-icon-system,
    :root[data-next="light"] .theme-toggle .theme-icon-light,
    :root[data-next="dark"] .theme-toggle .theme-icon-dark,
    :root[data-next="system"] .theme-label-system,
    :root[data-next="light"] .theme-label-light,
    :root[data-next="dark"] .theme-label-dark {
      display: block;
    }

    /* Layout */

    @media (max-width: 640px) {
      main,
      .footer-inner {
        width: calc(100% - 40px);
      }

      main {
        margin-top: 8px;
      }

      .story {
        padding: 20px 0 28px;
      }

      .story article {
        display: flow-root;
      }

      h2 {
        font-size: 17px;
      }

      .thumb {
        float: right;
        width: 160px;
        max-width: 48%;
        margin: 10px 0 10px 16px;
      }

      .meta {
        clear: both;
        gap: 10px;
      }
    }
  </style>
</head>
<body>
  <a class="skip" href="#feed">뉴스 목록으로 건너뛰기</a>
  <main id="feed" aria-label="뉴스 목록">
    <ol class="feed">$stories</ol>
    $empty
  </main>
  <footer lang="en">
    <div class="footer-inner">
      <span>Published $published</span>
      <nav aria-label="Links">
        <a href="https://news.ycombinator.com/" target="_blank" rel="noopener noreferrer">news.ycombinator.com</a>
        <a href="https://github.com/parksb/hnfront" target="_blank" rel="noopener noreferrer">github.com/parksb/hnfront</a>
        <button type="button" class="theme-toggle" aria-label="Theme: system (click for light)" title="Theme: system (click for light)">
          <svg class="theme-icon-system" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <defs>
              <mask id="theme-system-moon-bite" maskUnits="userSpaceOnUse" x="0" y="0" width="24" height="24">
                <rect x="0" y="0" width="24" height="24" fill="#ffffff"></rect>
                <circle cx="14.6" cy="14.7" r="4.3" fill="#000000"></circle>
              </mask>
            </defs>
            <path d="M8.18 15.82A5.4 5.4 0 0 1 15.82 8.18Z" fill="currentColor" stroke="none"></path>
            <path d="M15.82 8.18A5.4 5.4 0 0 1 8.18 15.82Z" fill="currentColor" stroke="none" mask="url(#theme-system-moon-bite)"></path>
            <path d="M12 4.4V2.6M6.9 6.9 5.7 5.7M4.4 12H2.6"></path>
            <line x1="20.5" y1="3.5" x2="3.5" y2="20.5"></line>
          </svg>
          <svg class="theme-icon-light" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path>
          </svg>
          <svg class="theme-icon-dark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12.79A9 9 0 1 1 11.21 3a7 7 0 0 0 9.79 9.79z"></path>
          </svg>
          <span class="theme-label theme-label-system">system</span>
          <span class="theme-label theme-label-light">light</span>
          <span class="theme-label theme-label-dark">dark</span>
        </button>
      </nav>
    </div>
  </footer>
  <script src="assets/math.js" defer></script>
  <script>
    const THEME_COLORS = { light: '#ffffff', dark: '#141517' };
    const THEME_MODES = ['system', 'light', 'dark'];

    const themeMeta = document.querySelector('meta[name="theme-color"]');
    const themeToggle = document.querySelector('.theme-toggle');
    const darkQuery = window.matchMedia('(prefers-color-scheme: dark)');

    function storedMode() {
      try {
        const value = localStorage.getItem('theme');
        if (value === 'light' || value === 'dark') return value;
      } catch (error) {
        // Storage can be unavailable, for example in private mode or on file://.
      }

      return 'system';
    }

    function saveMode(mode) {
      try {
        if (mode === 'system') {
          localStorage.removeItem('theme');
        } else {
          localStorage.setItem('theme', mode);
        }
      } catch (error) {
        // The toggle still works for this page view.
      }
    }

    function resolvedTheme(mode) {
      if (mode === 'light' || mode === 'dark') return mode;
      return darkQuery.matches ? 'dark' : 'light';
    }

    function nextMode(mode) {
      const index = THEME_MODES.indexOf(mode);
      return THEME_MODES[(index + 1) % THEME_MODES.length];
    }

    function applyMode(mode) {
      const theme = resolvedTheme(mode);
      const next = nextMode(mode);

      document.documentElement.dataset.mode = mode;
      document.documentElement.dataset.next = next;
      document.documentElement.dataset.theme = theme;

      if (themeMeta) themeMeta.content = THEME_COLORS[theme];

      if (themeToggle) {
        const label = 'Theme: ' + mode + ' (click for ' + next + ')';
        themeToggle.setAttribute('aria-label', label);
        themeToggle.title = label;
      }
    }

    function cycleTheme(event) {
      event.preventDefault();

      const mode = nextMode(document.documentElement.dataset.mode || storedMode());

      applyMode(mode);
      saveMode(mode);
    }

    if (themeToggle) {
      themeToggle.addEventListener('click', cycleTheme);
    }

    darkQuery.addEventListener('change', function () {
      // The system setting only applies while the toggle is on system.
      if ((document.documentElement.dataset.mode || 'system') !== 'system') return;

      applyMode('system');
    });

    applyMode(document.documentElement.dataset.mode || storedMode());

    const dateFormat = new Intl.DateTimeFormat('en-CA', {
      year: 'numeric', month: '2-digit', day: '2-digit',
      hour: '2-digit', minute: '2-digit', hourCycle: 'h23'
    });

    const relativeFormat = new Intl.RelativeTimeFormat('en', { numeric: 'always' });

    function timezoneOffset(date) {
      const minutes = -date.getTimezoneOffset();
      const sign = minutes >= 0 ? '+' : '-';
      const hours = String(Math.floor(Math.abs(minutes) / 60)).padStart(2, '0');
      const remainder = String(Math.abs(minutes) % 60).padStart(2, '0');
      return 'UTC' + sign + hours + ':' + remainder;
    }

    function absoluteTime(date) {
      const parts = Object.fromEntries(dateFormat.formatToParts(date).map(function (part) {
        return [part.type, part.value];
      }));
      return parts.year + '-' + parts.month + '-' + parts.day + ' ' + parts.hour + ':' + parts.minute + ' ' + timezoneOffset(date);
    }

    function relativeTime(date, now) {
      const elapsed = (date.getTime() - now) / 1000;
      const units = [['day', 86400], ['hour', 3600], ['minute', 60], ['second', 1]];

      for (const [unit, seconds] of units) {
        if (Math.abs(elapsed) >= seconds) {
          return relativeFormat.format(Math.trunc(elapsed / seconds), unit);
        }
      }
      return 'just now';
    }

    const timestamps = [];
    document.querySelectorAll('time[datetime]').forEach(function (time) {
      const date = new Date(time.dateTime);
      if (Number.isNaN(date.getTime())) return;

      time.title = absoluteTime(date);
      timestamps.push({ element: time, date: date });
    });

    function updateRelativeTimes() {
      const now = Date.now();
      timestamps.forEach(function (time) {
        const text = relativeTime(time.date, now);
        if (time.element.textContent !== text) time.element.textContent = text;
      });
    }

    updateRelativeTimes();
    setInterval(updateRelativeTimes, 1000);
    document.addEventListener('visibilitychange', function () {
      if (!document.hidden) updateRelativeTimes();
    });

    document.querySelectorAll('.thumb img').forEach(function (img) {
      function fallback() { img.parentElement.hidden = true; }
      img.addEventListener('error', fallback);
      if (img.complete && !img.naturalWidth) fallback();
    });
  </script>
</body>
</html>
