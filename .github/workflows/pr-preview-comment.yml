name: PR preview comment

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

permissions:
  actions: read
  contents: write
  pull-requests: write

concurrency:
  group: pr-preview-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  comment:
    name: Publish preview
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Resolve pull request
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          number=$(gh api "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/pulls" --jq '.[0].number // empty')

          if [ -z "$number" ]; then
            number=$(gh pr list --repo "$GITHUB_REPOSITORY" --search "$HEAD_SHA" --state all --json number --jq '.[0].number // empty')
          fi

          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Download artifacts
        if: steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name site-preview --dir site

      - name: Publish preview branch
        if: steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          preview="$RUNNER_TEMP/preview"

          rm -rf "$preview"
          git init --quiet "$preview"
          cd "$preview"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          if git ls-remote --exit-code --heads origin pr-previews > /dev/null; then
            git fetch --quiet origin pr-previews
            git checkout --quiet -B pr-previews FETCH_HEAD
          fi

          rm -rf "pr-${NUMBER}"
          mkdir -p "pr-${NUMBER}"
          cp "${GITHUB_WORKSPACE}/site/index.html" "pr-${NUMBER}/index.html"
          cp -R "${GITHUB_WORKSPACE}/site/assets" "pr-${NUMBER}/assets"

          git add "pr-${NUMBER}"
          if git status --porcelain | grep -q .; then
            git commit --quiet -m "preview: pull request ${NUMBER}"
            git push --quiet origin HEAD:refs/heads/pr-previews
          else
            echo 'Preview content is unchanged.'
          fi

      - name: Comment on pull request
        if: steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMBER: ${{ steps.pr.outputs.number }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          page="https://htmlpreview.github.io/?https://github.com/${GITHUB_REPOSITORY}/blob/pr-previews/pr-${NUMBER}/index.html"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}"
          commit_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${HEAD_SHA}"
          body="$RUNNER_TEMP/comment.md"

          {
            echo '<!-- pr-preview -->'
            echo '### Preview ready'
            echo
            echo '| Name | Link |'
            echo '| --- | --- |'
            echo "| Latest commit | [\`${HEAD_SHA:0:7}\`](${commit_url}) |"
            echo "| CI run | [Details](${run_url}) |"
            echo "| Preview | [Open preview](${page}) |"
          } > "$body"

          text=$(cat "$body")
          existing=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${NUMBER}/comments" --paginate --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- pr-preview -->"))) | .id' | head -n 1)

          if [ -n "$existing" ]; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${existing}" --raw-field body="$text" > /dev/null
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${NUMBER}/comments" --raw-field body="$text" > /dev/null
          fi
