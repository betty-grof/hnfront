[project]
name = "hnfront"
version = "0.1.0"
description = "Hacker News front page, summarized in Korean"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "mypy",
    "ruff",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unused_ignores = true
